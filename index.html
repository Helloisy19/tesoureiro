<!DOCTYPE html>
<html lang="pt-br">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <link rel="stylesheet" href="tesouraria.css">
    <title>Igreja Santa Fé_Tesouraria</title>
</head>
<body style="background:linear-gradient(to right, rgb(1, 36, 17), rgb(6, 45, 30))">

    <h1 id="pf">Painel Financeiro</h1>
    <div class="fundo">
        <p id="vs">Visão Geral</p>
    </div>
    <div class="entrada">
        <p id="setaC">↑</p>
        <p id="tE">R$0,00</p>
        <p id="T_e">Total de Entradas</p>
    </div>
    <div class="despesa">
        <p id="setaB">↓</p>
        <p id="tD">R$0,00</p>
        <p id="T_d">Total de Despesas</p>
    </div>
    <div class="linha"></div>
    <div class="linha2"></div>
    <div>
        <p id="s_a">Saldo Atual</p>
        <p id="sA">R$0,00</p>
    </div>
    <div class="linha3"></div>
    <div class="menu_f">
        <h1 id="mf">Movimentação Financeira</h1>
        <div id="f_mf">
            <img id="ent" src="deposito.png" alt="">
            <p id="en">Entradas</p>
            <p id="d_o">Dízimos e Ofertas</p>
        </div>
        <div id="f_de">
            <img id="des" src="despesas.png" alt="">
            <p id="de">Despesas</p>
            <p id="d_e">Contas e Pagamentos</p>
        </div>
        <div id="f_co">
            <img id="com" src="comprovante.png" alt="">
            <p id="co">Comprovantes</p>
            <p id="c_o">Comprovantes de Pagamentos</p>
        </div>
        <div id="f_re">
            <img id="rel" src="informacao-financeira.png" alt="">
            <p id="re">Relatórios</p>
            <p id="r_f">Movimentações financeiras</p>
        </div>
    </div>

    <script src="tesouraria.js"></script>

</body>
</html>
